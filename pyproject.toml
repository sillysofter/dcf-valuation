[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcfmodel"
version = "1.0.0"
description = "Discounted cash flow valuation with WACC build, sensitivity tables and a formula-driven Excel export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "mini-racer>=0.12"]  # mini-racer runs the website's JS engine in tests

[project.scripts]
dcfmodel = "dcfmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
